---
# ============================================================================
# Tailscale VPN - Linux
# ============================================================================

- name: Verificar si Tailscale esta instalado
  ansible.builtin.command: tailscale --version
  register: tailscale_installed
  changed_when: false
  failed_when: false

- name: Instalar Tailscale
  when: tailscale_installed.rc != 0
  block:
    - name: Descargar script de instalacion de Tailscale
      ansible.builtin.get_url:
        url: https://tailscale.com/install.sh
        dest: /tmp/tailscale-install.sh
        mode: "0755"

    - name: Ejecutar instalador de Tailscale
      ansible.builtin.command: /tmp/tailscale-install.sh
      changed_when: true

    - name: Limpiar instalador
      ansible.builtin.file:
        path: /tmp/tailscale-install.sh
        state: absent

- name: Habilitar servicio de Tailscale
  ansible.builtin.systemd:
    name: tailscaled
    state: started
    enabled: true

- name: Conectar a Tailscale con authkey
  ansible.builtin.command: tailscale up --authkey={{ tailscale_authkey }}
  when: tailscale_authkey != ''
  changed_when: true
  no_log: true
