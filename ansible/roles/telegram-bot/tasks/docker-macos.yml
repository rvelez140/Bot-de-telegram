---
# ============================================================================
# Docker Desktop Installation - macOS
# ============================================================================

- name: Verificar si Docker Desktop esta instalado
  ansible.builtin.stat:
    path: /Applications/Docker.app
  register: docker_app

- name: Instalar Docker Desktop via Homebrew
  community.general.homebrew_cask:
    name: docker
    state: present
  when: not docker_app.stat.exists

- name: Verificar que Docker esta corriendo
  ansible.builtin.command: docker --version
  register: docker_mac_version
  changed_when: false
  failed_when: false

- name: Informar estado de Docker en macOS
  ansible.builtin.debug:
    msg: >
      {{ 'Docker esta instalado: ' ~ docker_mac_version.stdout
         if docker_mac_version.rc == 0
         else 'Docker Desktop instalado pero necesita ser iniciado manualmente desde Applications.' }}
